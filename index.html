<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ZPlay</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
        <script src="main.js"></script>
    </head>
<body>
<main class="zplay-landing">
  <section class="zplay-intro" aria-labelledby="zplay-title">
    <p class="zplay-kicker">A small world of big dream. Imagination should be the driver of your life</p>
    <h1 id="zplay-title">ZPlay</h1>
    <p class="zplay-tagline">Step through the portal, make your idea and dream come true, and have some fun with your amazing Friends.</p>
    <div class="portal-scene" aria-hidden="true">
      <span class="star star-one"></span>
      <span class="star star-two"></span>
      <span class="star star-three"></span>
      <span class="cloud cloud-one"></span>
      <span class="cloud cloud-two"></span>
      <span class="island">
        <span class="tree tree-one"></span>
        <span class="tree tree-two"></span>
        <span class="portal"></span>
      </span>
    </div>
  </section>
  <section id="auth-container" class="auth-panel" aria-label="Account">
    <p id="auth-message" role="status" aria-live="polite"></p>
    <button id="login-btn" class="auth-button" type="button" onclick="signIn()">Sign in to ZPlay</button>
    <div id="user-profile" hidden>
      <p>Welcome back, <strong id="user-name"></strong>.</p>
      <button id="logout-btn" class="auth-button secondary" type="button" onclick="signOut()">Sign out</button>
    </div>
  </section>

  <section id="community-area" class="community-area" hidden aria-label="ZPlay community">
    <section class="community-panel player-panel" aria-labelledby="players-heading">
      <div class="panel-heading">
        <p class="panel-kicker">Online & recent</p>
        <h2 id="players-heading">Choose a player</h2>
      </div>
      <label class="sr-only" for="user-search-input">Search users</label>
      <input id="user-search-input" class="directory-search-input" type="search" placeholder="Search Entra users" autocomplete="off">
      <div id="online-users-list" class="online-users-list" aria-live="polite"></div>
    </section>

    <section class="community-panel chat-panel" aria-labelledby="chat-heading">
      <div class="panel-heading">
        <p class="panel-kicker">Direct message</p>
        <h2 id="chat-heading">Select someone to chat</h2>
      </div>
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="chat-input">Message</label>
        <input id="chat-input" name="message" type="text" maxlength="280" placeholder="Write a message" autocomplete="off" disabled>
        <button class="send-button" type="submit" aria-label="Send message" disabled>Send</button>
      </form>
    </section>
  </section>
</main>
<script src="presence.js"></script>
</body>
</html>
